<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1420" width="640" height="1420" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The ontology behind the related-articles graph</title>
<desc id="d">Articles link to concepts with about or applies; concepts link to broader concepts; the roles on a shared concept decide which relation types a pair of articles may use.</desc>
<rect width="640" height="1420" rx="14" fill="#f2f2ef"/>
<rect x="24" y="30" width="12" height="12" rx="2" fill="#2a78d6"/>
<text x="46" y="42" font-size="17" font-weight="700" fill="#0b0b0b" data-max="616" xml:space="preserve">Articles, concepts and three kinds of link</text>
<text x="24" y="70" font-size="17" font-weight="400" fill="#52514e" data-max="616" xml:space="preserve">One real example. The whole graph has 113 articles, 51 concepts,</text>
<text x="24" y="93" font-size="17" font-weight="400" fill="#52514e" data-max="616" xml:space="preserve">234 article-to-concept links and 17 broader links.</text>
