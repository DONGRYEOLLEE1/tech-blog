<text x="20" y="31" font-size="18" font-weight="700" fill="#141413" data-max="620" xml:space="preserve">Articles, concepts and three kinds of link</text>
<text x="20" y="55" font-size="17" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve">One real example. The whole graph has 113 articles, 51 concepts,</text>
<text x="20" y="77" font-size="17" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve">234 article-to-concept links and 17 broader links.</text>
<text x="20" y="120" font-size="17" font-weight="700" fill="#45443f" data-max="620" xml:space="preserve">Articles</text>
<text x="440" y="120" font-size="17" font-weight="700" fill="#45443f" data-max="620" xml:space="preserve">Concepts</text>
<text x="72" y="406" font-size="17" font-weight="700" fill="#1c58ad" data-max="620" xml:space="preserve">about</text>
<text x="148" y="406" font-size="17" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve">a main subject the article explains or evaluates</text>
<text x="72" y="432" font-size="17" font-weight="700" fill="#b53f14" data-max="620" xml:space="preserve">applies</text>
<text x="148" y="432" font-size="17" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve">a technique the article uses</text>
<text x="72" y="458" font-size="17" font-weight="700" fill="#66655f" data-max="620" xml:space="preserve">broader</text>
<text x="148" y="458" font-size="17" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve">a concept's parent; not used for ranking</text>
<text x="20" y="488" font-size="17" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve">Six more concept links of these three articles are not drawn.</text>
<text x="20" y="539" font-size="18" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve"><tspan font-weight="700" fill="#141413">Relation types a pair may use</tspan>, source → target</text>
<text x="20" y="563" font-size="17" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve">Set in code before the model is asked.</text>
<text x="20" y="859" font-size="18" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve"><tspan font-weight="700" fill="#141413">The same articles</tspan>, as stored in the records</text>
