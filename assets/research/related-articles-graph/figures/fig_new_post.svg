<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1050" width="640" height="1050" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What publishing one new post triggers</title>
<desc id="d">The new post is embedded, its facts are extracted, candidates are recomputed in code, then the new post and the k existing posts whose input hash changed are reranked; the other records are reused. The call count is 2 + k; in four test posts k was 6, 0, 2 and 11.</desc>
<rect width="640" height="1050" rx="14" fill="#f2f2ef"/>
<rect x="24" y="30" width="12" height="12" rx="2" fill="#2a78d6"/>
<text x="46" y="42" font-size="17" font-weight="700" fill="#0b0b0b" data-max="616" xml:space="preserve">Publishing one new post when 113 posts have records</text>
<rect x="24" y="55.5" width="93.7" height="26" rx="6" fill="#2a78d6"/>
<text x="70.9" y="74" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-max="114.7" data-min="27" xml:space="preserve">model id</text>
<text x="127.7" y="74" font-size="17" font-weight="400" fill="#52514e" data-max="616" xml:space="preserve">this step calls that model through OpenRouter</text>
<rect x="24" y="96" width="280" height="149" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="40" y="125" font-size="18" font-weight="700" fill="#0b0b0b" data-max="292" xml:space="preserve">1. Embed the new blocks</text>
<rect x="40" y="136" width="245.1" height="26" rx="6" fill="#2a78d6"/>
<text x="162.5" y="154.5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-max="282.1" data-min="43" xml:space="preserve">google/gemini-embedding-2</text>
<text x="40" y="186" font-size="17" font-weight="400" fill="#52514e" data-max="292" xml:space="preserve">1 embedding request</text>
<text x="40" y="209" font-size="17" font-weight="400" fill="#52514e" data-max="292" xml:space="preserve">(6–9 blocks in the tests);</text>
<text x="40" y="232" font-size="17" font-weight="400" fill="#52514e" data-max="292" xml:space="preserve">cached vectors are reused</text>
<rect x="336" y="96" width="280" height="149" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="352" y="125" font-size="18" font-weight="700" fill="#0b0b0b" data-max="604" xml:space="preserve">2. Extract its facts</text>
<rect x="352" y="136" width="164.9" height="26" rx="6" fill="#2a78d6"/>
<text x="434.4" y="154.5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-max="513.9" data-min="355" xml:space="preserve">openai/gpt-6-luna</text>
<text x="352" y="186" font-size="17" font-weight="400" fill="#52514e" data-max="604" xml:space="preserve">1 LLM call, new post only;</text>
<text x="352" y="209" font-size="17" font-weight="400" fill="#52514e" data-max="604" xml:space="preserve">facts of the existing</text>
<text x="352" y="232" font-size="17" font-weight="400" fill="#52514e" data-max="604" xml:space="preserve">posts are reused</text>
<path d="M335 170.5L327 174.7L327 166.3Z" fill="#6b6a65"/>
<path d="M305 170.5L328.2 170.5" fill="none" stroke="#6b6a65" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M476 277L471.3 268L480.7 268Z" fill="#6b6a65"/>
<path d="M476 245L476 269.4" fill="none" stroke="#6b6a65" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="butt"/>
<rect x="24" y="277" width="592" height="90" rx="10" fill="#ffffff" stroke="#d7d6cf" stroke-width="1.2"/>
<text x="40" y="306" font-size="18" font-weight="700" fill="#0b0b0b" data-max="604" xml:space="preserve">3. Recompute and compare</text>
<text x="40" y="331" font-size="17" font-weight="400" fill="#52514e" data-max="604" xml:space="preserve">code only: candidates and evidence blocks of every post, then</text>
<text x="40" y="354" font-size="17" font-weight="400" fill="#52514e" data-max="604" xml:space="preserve">each post's reranking input hash against the stored one</text>
<text x="84" y="403" font-size="17" font-weight="700" fill="#52514e" data-max="616" xml:space="preserve">no stored record</text>
<rect x="84" y="413" width="532" height="103" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="100" y="442" font-size="18" font-weight="700" fill="#0b0b0b" data-max="604" xml:space="preserve">4. Rerank the new post</text>
<rect x="100" y="453" width="164.9" height="26" rx="6" fill="#2a78d6"/>
<text x="182.4" y="471.5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-max="261.9" data-min="103" xml:space="preserve">openai/gpt-6-luna</text>
<text x="100" y="503" font-size="17" font-weight="400" fill="#52514e" data-max="604" xml:space="preserve">1 LLM call: up to 15 candidates in, 0–4 picks out</text>
<text x="84" y="542" font-size="17" font-weight="700" fill="#52514e" data-max="616" xml:space="preserve">input hash changed</text>
<rect x="84" y="552" width="532" height="103" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="100" y="581" font-size="18" font-weight="700" fill="#0b0b0b" data-max="604" xml:space="preserve">5. Rerank k existing posts</text>
<rect x="100" y="592" width="164.9" height="26" rx="6" fill="#2a78d6"/>
<text x="182.4" y="610.5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" data-max="261.9" data-min="103" xml:space="preserve">openai/gpt-6-luna</text>
<text x="100" y="642" font-size="17" font-weight="400" fill="#52514e" data-max="604" xml:space="preserve">k LLM calls: candidates or evidence blocks changed</text>
<text x="84" y="681" font-size="17" font-weight="700" fill="#52514e" data-max="616" xml:space="preserve">input hash unchanged</text>
<rect x="84" y="691" width="532" height="67" rx="10" fill="#f2f2ef" stroke="#7a7872" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="100" y="720" font-size="18" font-weight="700" fill="#0b0b0b" data-max="604" xml:space="preserve">The other 113 − k posts</text>
<text x="100" y="745" font-size="17" font-weight="400" fill="#52514e" data-max="604" xml:space="preserve">record reused as it is: 0 calls</text>
<path d="M50 367L50 724.5" fill="none" stroke="#6b6a65" stroke-width="1.8" stroke-linecap="round"/>
<path d="M83 464.5L75 468.7L75 460.3Z" fill="#6b6a65"/>
<path d="M50 464.5L76.2 464.5" fill="none" stroke="#6b6a65" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M83 603.5L75 607.7L75 599.3Z" fill="#6b6a65"/>
<path d="M50 603.5L76.2 603.5" fill="none" stroke="#6b6a65" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M83 724.5L75 728.7L75 720.3Z" fill="#6b6a65"/>
<path d="M50 724.5L76.2 724.5" fill="none" stroke="#6b6a65" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M320 792L315.3 783L324.7 783Z" fill="#6b6a65"/>
<path d="M320 758L320 784.4" fill="none" stroke="#6b6a65" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="butt"/>
<rect x="24" y="792" width="592" height="90" rx="10" fill="#ffffff" stroke="#d7d6cf" stroke-width="1.2"/>
<text x="40" y="821" font-size="18" font-weight="700" fill="#0b0b0b" data-max="604" xml:space="preserve">6. Offline build</text>
<text x="40" y="846" font-size="17" font-weight="400" fill="#52514e" data-max="604" xml:space="preserve">checks every record and renders the site:</text>
<text x="40" y="869" font-size="17" font-weight="400" fill="#52514e" data-max="604" xml:space="preserve">0 model calls, no API key</text>
<path d="M24 912L616 912" fill="none" stroke="#c3c2b7" stroke-width="1.2" stroke-linecap="round"/>
<rect x="24" y="934" width="12" height="12" rx="2" fill="#2a78d6"/>
<text x="46" y="948" font-size="20" font-weight="700" fill="#0b0b0b" data-max="616" xml:space="preserve">LLM calls for one new post = <tspan fill="#2a78d6">2 + k</tspan></text>
<text x="24" y="978" font-size="17" font-weight="400" fill="#52514e" data-max="616" xml:space="preserve">1 fact extraction + 1 reranking call for the new post + k reranking</text>
<text x="24" y="1001" font-size="17" font-weight="400" fill="#52514e" data-max="616" xml:space="preserve">calls for existing posts whose input hash changed.</text>
<text x="24" y="1024" font-size="17" font-weight="400" fill="#52514e" data-max="616" xml:space="preserve">In four test posts k was 6, 0, 2 and 11.</text>
</svg>
