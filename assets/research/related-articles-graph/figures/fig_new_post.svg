<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 996" width="640" height="996" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What publishing one new post triggers</title>
<desc id="d">The new post is embedded, its facts are extracted, candidates are recomputed in code, then the new post and the k existing posts whose input hash changed are reranked; the other records are reused. The call count is 2 + k; in four test posts k was 6, 0, 2 and 11.</desc>
<clipPath id="panel"><rect width="640" height="996" rx="14"/></clipPath>
<g clip-path="url(#panel)">
<rect x="0" y="0" width="640" height="728" fill="#efece4"/>
<rect x="0" y="0" width="640" height="78" fill="#e1dccf"/>
<rect x="0" y="728" width="640" height="122" fill="#e2ece8"/>
<rect x="0" y="850" width="640" height="146" fill="#efece4"/>
<rect x="0" y="850" width="640" height="52" fill="#e1dccf"/>
<text x="20" y="31" font-size="18" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve"><tspan font-weight="700" fill="#141413">Publishing one new post</tspan> when 113 posts have records</text>
<rect x="20" y="43" width="93.8" height="28" rx="7" fill="#1c58ad"/>
<text x="66.9" y="63" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" data-max="110.8" data-min="23" xml:space="preserve">model id</text>
<text x="119.8" y="63" font-size="17" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve">this step calls that model through OpenRouter</text>
<text x="20" y="885" font-size="22" font-weight="700" fill="#141413" data-max="620" xml:space="preserve">LLM calls for one new post = <tspan fill="#1c58ad">2 + k</tspan></text>
<text x="20" y="930" font-size="17" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve">1 fact extraction + 1 reranking call for the new post + k reranking</text>
<text x="20" y="952" font-size="17" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve">calls for existing posts whose input hash changed.</text>
<text x="20" y="974" font-size="17" font-weight="400" fill="#45443f" data-max="620" xml:space="preserve">In four test posts k was 6, 0, 2 and 11.</text>
