<text x="492.7" y="114" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" data-max="617" data-min="368.4" xml:space="preserve">google/gemini-embedding-2</text>
<text x="70" y="121" font-size="18" font-weight="700" fill="#141413" data-max="355.4" xml:space="preserve">Embed the new blocks</text>
<text x="70" y="145" font-size="17" font-weight="400" fill="#45443f" data-max="608" xml:space="preserve">1 embedding request (6–9 blocks in the tests);</text>
<text x="70" y="167" font-size="17" font-weight="400" fill="#45443f" data-max="608" xml:space="preserve">cached vectors are reused</text>
<rect x="56" y="204" width="564" height="64" rx="10" fill="#ffffff" stroke="#1c58ad" stroke-width="2" data-card="1"/>
<path d="M450.6 204H610A10 10 0 0 1 620 214V232H459.6A9 9 0 0 1 450.6 223Z" fill="#1c58ad"/>
<text x="535.3" y="224" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" data-max="617" data-min="453.6" xml:space="preserve">openai/gpt-6-luna</text>
<text x="70" y="231" font-size="18" font-weight="700" fill="#141413" data-max="440.6" xml:space="preserve">Extract its facts</text>
<text x="70" y="255" font-size="17" font-weight="400" fill="#45443f" data-max="608" xml:space="preserve">1 LLM call, new post only; facts of the existing posts are reused</text>
<rect x="56" y="292" width="564" height="86" rx="10" fill="#f9f7f2" stroke="#c9c5b8" stroke-width="1" data-card="1"/>
<text x="70" y="319" font-size="18" font-weight="700" fill="#141413" data-max="608" xml:space="preserve">Recompute and compare</text>
<text x="70" y="343" font-size="17" font-weight="400" fill="#45443f" data-max="608" xml:space="preserve">code only: candidates and evidence blocks of every post, then</text>
<text x="70" y="365" font-size="17" font-weight="400" fill="#45443f" data-max="608" xml:space="preserve">each post's reranking input hash against the stored one</text>
<rect x="92" y="424" width="498" height="64" rx="10" fill="#ffffff" stroke="#1c58ad" stroke-width="2" data-card="1"/>
<path d="M420.6 424H580A10 10 0 0 1 590 434V452H429.6A9 9 0 0 1 420.6 443Z" fill="#1c58ad"/>
<text x="505.3" y="444" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" data-max="587" data-min="423.6" xml:space="preserve">openai/gpt-6-luna</text>
<text x="106" y="451" font-size="18" font-weight="700" fill="#141413" data-max="410.6" xml:space="preserve">Rerank the new post</text>
<text x="106" y="475" font-size="17" font-weight="400" fill="#45443f" data-max="578" xml:space="preserve">1 LLM call: up to 15 candidates in, 0–4 picks out</text>
<rect x="92" y="534" width="498" height="64" rx="10" fill="#ffffff" stroke="#1c58ad" stroke-width="2" data-card="1"/>
<path d="M420.6 534H580A10 10 0 0 1 590 544V562H429.6A9 9 0 0 1 420.6 553Z" fill="#1c58ad"/>
<text x="505.3" y="554" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" data-max="587" data-min="423.6" xml:space="preserve">openai/gpt-6-luna</text>
<text x="106" y="561" font-size="18" font-weight="700" fill="#141413" data-max="410.6" xml:space="preserve">Rerank k existing posts</text>
<text x="106" y="585" font-size="17" font-weight="400" fill="#45443f" data-max="578" xml:space="preserve">k LLM calls: candidates or evidence blocks changed</text>
<rect x="92" y="644" width="498" height="64" rx="10" fill="#efece4" stroke="#66655f" stroke-width="1.5" stroke-dasharray="6 5" pathLength="1111" data-card="1"/>
<text x="106" y="671" font-size="18" font-weight="700" fill="#141413" data-max="578" xml:space="preserve">The other 113 − k posts</text>
<text x="106" y="695" font-size="17" font-weight="400" fill="#45443f" data-max="578" xml:space="preserve">record reused as it is: 0 calls</text>
<rect x="56" y="744" width="564" height="86" rx="10" fill="#f9f7f2" stroke="#b4c8c0" stroke-width="1" data-card="1"/>
<text x="70" y="771" font-size="18" font-weight="700" fill="#141413" data-max="608" xml:space="preserve">Offline build</text>
<text x="70" y="795" font-size="17" font-weight="400" fill="#45443f" data-max="608" xml:space="preserve">checks every record and renders the site:</text>
<text x="70" y="817" font-size="17" font-weight="400" fill="#45443f" data-max="608" xml:space="preserve">0 model calls, no API key</text>
